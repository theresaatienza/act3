<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - RML Construction Supply</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      body {
        position: relative;
        background-color: #ffffff;
      }

      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://i.pinimg.com/736x/ba/f6/29/baf629275e49653b0013ca5ecd4d0361.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.5; 
        z-index: -1; 
      }
    </style>
  </head>
  <body class="bg-light min-vh-100 d-flex align-items-center justify-content-center p-3">

    <div class="card shadow-lg border-danger-subtle rounded-4 w-100" style="max-width: 480px;">
      
      <div class="card-header bg-danger text-white text-center py-4 rounded-top-4">
        <h2 class="h4 fw-bold mb-1">RML Construction Supply</h2>
        <p class="small mb-0 opacity-75">Create a new account</p>
      </div>

      <div class="card-body p-4 p-sm-5 bg-white">
        <form>
          <div class="mb-3">
            <label for="fullNameInput" class="form-label fw-semibold text-dark">Full Name</label>
            <input type="text" class="form-control border-danger-subtle" id="fullNameInput" placeholder="Theresa Atienza" required>
          </div>

          <div class="mb-3">
            <label for="emailInput" class="form-label fw-semibold text-dark">Email Address</label>
            <input type="email" class="form-control border-danger-subtle" id="emailInput" placeholder="theresa@example.com" required>
          </div>

          <div class="mb-3">
            <label for="passwordInput" class="form-label fw-semibold text-dark">Password</label>
            <input type="password" class="form-control border-danger-subtle" id="passwordInput" placeholder="Create a password" required>
          </div>

          <div class="mb-3">
            <label for="confirmPasswordInput" class="form-label fw-semibold text-dark">Confirm Password</label>
            <input type="password" class="form-control border-danger-subtle" id="confirmPasswordInput" placeholder="Re-enter your password" required>
          </div>

          <div class="mb-4 form-check">
            <input class="form-check-input" type="checkbox" id="termsCheck" required>
            <label class="form-check-label small text-muted" for="termsCheck">
              I agree to the <a href="#" class="text-danger text-decoration-none">Terms & Conditions</a>
            </label>
          </div>

          <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold shadow-sm">Register</button>
        </form>
      </div>

      <div class="card-footer bg-light text-center py-3 rounded-bottom-4 border-0">
        <span class="small text-muted">Already have an account? </span>
        <a href="login.html" class="small text-danger fw-bold text-decoration-none">Sign In</a>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
